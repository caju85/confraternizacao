<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confraternização SAC e Amigos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Fundo levemente cinza/branco para destacar o card */
            color: #1e293b;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .font-mono { font-family: 'Fira Code', monospace; }

        /* Animação dos Confetes */
        .confetti {
            position: fixed;
            width: 8px;
            height: 16px;
            animation: fall linear forwards;
            pointer-events: none; /* Fundamental para não travar os botões do formulário */
            z-index: 0;
            border-radius: 2px;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Custom Scrollbar para o Terminal */
        .term-scrollbar::-webkit-scrollbar { width: 6px; }
        .term-scrollbar::-webkit-scrollbar-track { background: #111; }
        .term-scrollbar::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        .term-scrollbar::-webkit-scrollbar-thumb:hover { background: #666; }
        
        /* Efeitos visuais para interatividade */
        input[type="radio"]:checked + div { transform: scale(0.98); }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="relative flex flex-col items-center py-10 px-4 md:px-8">

    <div id="confetti-container" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div class="z-10 w-full max-w-3xl relative">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-red-600 mb-2 uppercase tracking-tight drop-shadow-sm">
                Confraternização
            </h1>
            <h2 class="text-2xl md:text-3xl font-bold text-yellow-500 mb-4 drop-shadow-sm">
                SAC e Amigos
            </h2>
            <div class="inline-block bg-white border-2 border-yellow-400 px-5 py-2 rounded-full shadow-sm">
                <span class="text-sm md:text-base font-bold text-gray-700">
                    TI - HC/Unicamp
                </span>
            </div>
        </header>

        <div class="bg-white rounded-2xl p-6 md:p-8 shadow-xl mb-8 border-t-8 border-red-600 border-x-2 border-b-2 border-gray-100">
            <form id="rsvp-form" class="space-y-8">
                
                <!-- Pergunta Inicial -->
                <div>
                    <label class="block text-2xl font-bold text-red-700 mb-4 text-center">Você vai participar?</label>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="attending" value="yes" class="peer sr-only" required>
                            <div class="flex items-center justify-center py-4 bg-white border-2 border-gray-200 rounded-xl text-gray-600 peer-checked:bg-red-600 peer-checked:border-red-600 peer-checked:text-white font-bold transition-all shadow-sm text-lg hover:border-red-400 select-none">
                                Sim, com certeza!
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="attending" value="no" class="peer sr-only">
                            <div class="flex items-center justify-center py-4 bg-white border-2 border-gray-200 rounded-xl text-gray-600 peer-checked:bg-yellow-400 peer-checked:border-yellow-400 peer-checked:text-red-900 font-bold transition-all shadow-sm text-lg hover:border-yellow-400 select-none">
                                Não poderei
                            </div>
                        </label>
                    </div>
                </div>

                <div id="dynamic-fields" class="space-y-8 hidden fade-in">
                    
                    <!-- Nome (Aparece para ambos os casos) -->
                    <div>
                        <label for="name" class="block text-base font-bold text-red-700 mb-2">Nome Completo</label>
                        <input type="text" id="name" placeholder="Digite seu nome" 
                            class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-200 transition-all font-medium">
                    </div>

                    <!-- Campos específicos para quem respondeu SIM -->
                    <div id="yes-fields" class="space-y-8 hidden">
                        
                        <!-- Acompanhantes -->
                        <div class="bg-gray-50 p-5 rounded-xl border-2 border-gray-100">
                            <label class="block text-base font-bold text-red-700 mb-3">Quantidade de Acompanhantes</label>
                            <div class="grid grid-cols-5 gap-2 md:gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="guests" value="0" class="peer sr-only">
                                    <div class="text-center bg-white border-2 border-gray-200 rounded-lg py-3 text-gray-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 font-bold transition-all select-none">0</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="guests" value="1" class="peer sr-only">
                                    <div class="text-center bg-white border-2 border-gray-200 rounded-lg py-3 text-gray-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 font-bold transition-all select-none">1</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="guests" value="2" class="peer sr-only">
                                    <div class="text-center bg-white border-2 border-gray-200 rounded-lg py-3 text-gray-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 font-bold transition-all select-none">2</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="guests" value="3" class="peer sr-only">
                                    <div class="text-center bg-white border-2 border-gray-200 rounded-lg py-3 text-gray-600 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 font-bold transition-all select-none">3</div>
                                </label>
                                <!-- Opção divertida Família Dias (Vale 4) -->
                                <label class="cursor-pointer h-full">
                                    <input type="radio" name="guests" value="4" class="peer sr-only">
                                    <div class="flex flex-col items-center justify-center bg-yellow-50 border-2 border-yellow-400 rounded-lg py-1 h-full text-red-800 peer-checked:bg-yellow-400 peer-checked:border-yellow-500 font-black transition-all select-none text-center shadow-sm">
                                        <span class="text-[10px] md:text-[11px] uppercase leading-tight">Família</span>
                                        <span class="text-xs md:text-sm leading-tight">Dias</span>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- Enquete -->
                        <div>
                            <label class="block text-base font-bold text-red-700 mb-3">Enquete do Churrasco</label>
                            <div class="space-y-3">
                                <label class="flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-yellow-400 transition-colors bg-white group">
                                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full group-hover:border-yellow-500 flex items-center justify-center mr-3 relative">
                                        <input type="radio" name="poll" value="Kit churras + Sua Bebida" class="peer sr-only">
                                        <div class="w-3 h-3 bg-red-600 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
                                    </div>
                                    <span class="font-semibold text-gray-800 select-none">Kit churras + Sua Bebida</span>
                                </label>
                                <label class="flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-yellow-400 transition-colors bg-white group">
                                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full group-hover:border-yellow-500 flex items-center justify-center mr-3 relative">
                                        <input type="radio" name="poll" value="Rateio da Carne + Sua Bebida" class="peer sr-only">
                                        <div class="w-3 h-3 bg-red-600 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
                                    </div>
                                    <span class="font-semibold text-gray-800 select-none">Rateio da Carne + Sua Bebida</span>
                                </label>
                            </div>
                        </div>

                        <!-- Termo de Convivência -->
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-r-xl">
                            <label class="flex items-start cursor-pointer">
                                <input type="checkbox" id="terms" class="mt-1 w-5 h-5 text-red-600 accent-red-600 rounded focus:ring-red-500 shrink-0">
                                <span class="ml-3 text-sm text-red-900 font-semibold leading-relaxed select-none">
                                    O SAC da área de TI do HC/Unicamp preza por um ambiente plural e democrático. Celebramos a diversidade e o respeito mútuo. Atitudes intolerantes ou extremistas não fazem parte da nossa cultura e não são bem-vindas em nosso evento.
                                </span>
                            </label>
                        </div>
                    </div>

                    <div id="form-message" class="hidden p-4 rounded-xl text-sm font-bold text-center border-2"></div>
                    
                    <button type="submit" id="submit-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black text-xl py-4 rounded-xl shadow-md transition-all uppercase tracking-widest active:translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
                        Enviar Resposta
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-black rounded-xl shadow-2xl overflow-hidden border border-gray-800 mb-10">
            <!-- Header do Terminal -->
            <div class="bg-gray-900 px-4 py-3 flex items-center border-b border-gray-800">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <div class="text-gray-400 font-mono text-xs ml-4">root@sac-ti-hc:~/sys_rsvp#</div>
                <div id="connection-status" class="ml-auto flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span class="text-xs text-gray-500 font-mono">Conectando...</span>
                </div>
            </div>

            <!-- Corpo do Terminal -->
            <div class="p-4 font-mono text-sm flex flex-col h-80">
                <div id="terminal-logs" class="flex-1 overflow-y-auto term-scrollbar space-y-1 text-green-500 mb-4 pb-2 pr-2">
                    <div class="text-gray-500">> Inicializando sistema de RSVP... [OK]</div>
                    <div class="text-gray-500">> Conectando ao banco de dados...</div>
                </div>

                <div class="border-t border-dashed border-gray-700 pt-3 text-green-400 bg-black">
                    <div class="text-yellow-400 font-bold mb-1">=== CONSOLIDAÇÃO DE DADOS ===</div>
                    <div class="grid grid-cols-2 gap-x-4 gap-y-1">
                        <div>> Titulares: <span id="sum-users" class="text-white font-bold">0</span></div>
                        <div>> Acompanhantes: <span id="sum-guests" class="text-white font-bold">0</span></div>
                        <div class="col-span-2 text-red-500 font-bold text-base mt-1">
                            > TOTAL GERAL: <span id="sum-total" class="text-white font-black">0</span>
                        </div>
                        <div class="col-span-2 mt-2 border-t border-gray-800 pt-2 text-gray-400 text-xs flex flex-col sm:flex-row sm:gap-4">
                            <span class="text-yellow-500">> ENQUETE:</span>
                            <span>[Kit Churrasco: <span id="sum-kit" class="text-white font-bold">0</span>]</span>
                            <span>[Rateio da Carne: <span id="sum-rateio" class="text-white font-bold">0</span>]</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Inicialização do Ambiente
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sac-confra-app';
        let firebaseConfig;
        
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-project" };
        } catch (e) {
            firebaseConfig = { projectId: "demo-project" };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // DOM Elements
        const form = document.getElementById('rsvp-form');
        const radiosAttending = document.querySelectorAll('input[name="attending"]');
        const dynamicFields = document.getElementById('dynamic-fields');
        const yesFields = document.getElementById('yes-fields');
        const nameInput = document.getElementById('name');
        const termsCheckbox = document.getElementById('terms');
        const formMessage = document.getElementById('form-message');
        const submitBtn = document.getElementById('submit-btn');
        const termLogs = document.getElementById('terminal-logs');
        const connectionStatus = document.getElementById('connection-status');

        radiosAttending.forEach(radio => {
            radio.addEventListener('change', (e) => {
                dynamicFields.classList.remove('hidden');
                hideMessage();
                
                if (e.target.value === 'yes') {
                    yesFields.classList.remove('hidden');
                    nameInput.required = true;
                    termsCheckbox.required = true;
                } else {
                    yesFields.classList.add('hidden');
                    nameInput.required = true;
                    termsCheckbox.required = false;
                    
                    // Limpa opções se mudar para 'Não'
                    const guestChecked = document.querySelector('input[name="guests"]:checked');
                    const pollChecked = document.querySelector('input[name="poll"]:checked');
                    if (guestChecked) guestChecked.checked = false;
                    if (pollChecked) pollChecked.checked = false;
                    termsCheckbox.checked = false;
                }
            });
        });

        // Utils de interface
        function showMessage(msg, type = 'error') {
            formMessage.textContent = msg;
            formMessage.classList.remove('hidden');
            formMessage.className = `p-4 rounded-xl text-sm font-bold text-center border-2 mb-4 ${
                type === 'error' 
                    ? 'bg-red-50 text-red-600 border-red-200' 
                    : 'bg-green-50 text-green-700 border-green-200'
            }`;
        }

        function hideMessage() {
            formMessage.classList.add('hidden');
        }

        async function initAuthAndData() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                connectionStatus.innerHTML = `
                    <div class="w-2 h-2 rounded-full bg-green-500"></div>
                    <span class="text-xs text-green-500 font-mono">Online</span>
                `;
                termLogs.innerHTML += `<div class="text-green-400">> Conexão estabelecida. [OK]</div>`;
                
                listenToReservations();
            } catch (error) {
                console.error("Auth error:", error);
                connectionStatus.innerHTML = `
                    <div class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span class="text-xs text-red-500 font-mono">Offline</span>
                `;
                termLogs.innerHTML += `<div class="text-red-500">> Falha na conexão.</div>`;
            }
        }

        function listenToReservations() {
            const rsvpRef = collection(db, 'artifacts', appId, 'public', 'data', 'rsvp_list');
            
            onSnapshot(rsvpRef, (snapshot) => {
                let stats = { titulares: 0, acompanhantes: 0, kit: 0, rateio: 0 };
                
                termLogs.innerHTML = `<div class="text-gray-500">> Sincronizando tabela rsvp_list...</div>`;

                const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => {
                        const tA = a.timestamp ? a.timestamp.toMillis() : 0;
                        const tB = b.timestamp ? b.timestamp.toMillis() : 0;
                        return tA - tB;
                    });

                docs.forEach(data => {
                    renderLogLine(data);
                    
                    if (data.attending === 'yes') {
                        stats.titulares++;
                        stats.acompanhantes += parseInt(data.guests || 0);
                        if (data.poll && data.poll.includes('Kit')) stats.kit++;
                        if (data.poll && data.poll.includes('Rateio')) stats.rateio++;
                    }
                });

                updateSummary(stats);
            }, (error) => {
                console.error("Snapshot error:", error);
            });
        }

        function renderLogLine(data) {
            const div = document.createElement('div');
            const safeName = (data.name || 'Anônimo').replace(/"/g, "'");

            if (data.attending === 'yes') {
                let guestLabel = data.guests == 4 ? "'Familia Dias'" : data.guests;
                let pollLabel = (data.poll || '').includes('Kit') ? "'Kit'" : "'Rateio'";
                
                div.innerHTML = `> <span class="text-blue-400">INSERT INTO</span> rsvp (nome, status, convidados, enquete) <span class="text-blue-400">VALUES</span> ("<span class="text-white">${safeName}</span>", <span class="text-yellow-400">"CONFIRMADO"</span>, <span class="text-white">${guestLabel}</span>, <span class="text-white">${pollLabel}</span>); <span class="text-gray-500">// OK</span>`;
            } else {
                div.innerHTML = `> <span class="text-blue-400">INSERT INTO</span> rsvp (nome, status) <span class="text-blue-400">VALUES</span> ("<span class="text-white">${safeName}</span>", <span class="text-red-500">"AUSENTE"</span>); <span class="text-gray-500">// OK</span>`;
            }

            termLogs.appendChild(div);
            termLogs.scrollTop = termLogs.scrollHeight;
        }

        function updateSummary(stats) {
            document.getElementById('sum-users').textContent = stats.titulares;
            document.getElementById('sum-guests').textContent = stats.acompanhantes;
            document.getElementById('sum-total').textContent = stats.titulares + stats.acompanhantes;
            document.getElementById('sum-kit').textContent = stats.kit;
            document.getElementById('sum-rateio').textContent = stats.rateio;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();
            
            if (!auth.currentUser) {
                showMessage("Aguarde a conexão com o servidor.", "error");
                return;
            }

            const attendingRadio = document.querySelector('input[name="attending"]:checked');
            if (!attendingRadio) return;
            
            const attending = attendingRadio.value;
            const name = nameInput.value.trim();
            
            if (!name) { showMessage("Por favor, digite seu Nome Completo."); return; }

            let guests = 0;
            let poll = '';

            if (attending === 'yes') {
                const guestRadio = document.querySelector('input[name="guests"]:checked');
                const pollRadio = document.querySelector('input[name="poll"]:checked');

                if (!guestRadio) { showMessage("Selecione a quantidade de acompanhantes."); return; }
                if (!pollRadio) { showMessage("Responda à Enquete do Churrasco."); return; }
                if (!termsCheckbox.checked) { showMessage("Você deve concordar com o Termo de Convivência."); return; }

                guests = parseInt(guestRadio.value);
                poll = pollRadio.value;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processando...';

            try {
                const rsvpRef = collection(db, 'artifacts', appId, 'public', 'data', 'rsvp_list');
                await addDoc(rsvpRef, {
                    name,
                    attending,
                    guests,
                    poll,
                    timestamp: serverTimestamp(),
                    userId: auth.currentUser.uid
                });

                showMessage("Registro efetuado com sucesso! Verifique o terminal abaixo.", "success");
                
                setTimeout(() => {
                    form.reset();
                    dynamicFields.classList.add('hidden');
                    yesFields.classList.add('hidden');
                    hideMessage();
                }, 3000);

            } catch (error) {
                console.error("Save error:", error);
                showMessage("Falha na gravação. Tente novamente.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Resposta';
            }
        });

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['bg-red-600', 'bg-yellow-400', 'bg-white', 'bg-red-400']; 
            
            setInterval(() => {
                const conf = document.createElement('div');
                const colorClass = colors[Math.floor(Math.random() * colors.length)];
                
                conf.className = `confetti ${colorClass} shadow-sm`;
                conf.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 3 + 3; // 3s a 6s
                conf.style.animationDuration = duration + 's';
                
                container.appendChild(conf);
                
                setTimeout(() => {
                    if (conf.parentNode) conf.parentNode.removeChild(conf);
                }, duration * 1000);
            }, 300); // Confetes a cada 300ms
        }

        // Inicializar
        window.onload = () => {
            createConfetti();
            initAuthAndData();
        };
    </script>
</body>
</html>
